name: lint

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

concurrency:
  group: pr-ci-lint.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: docker-rollout
