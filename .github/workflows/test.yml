name: test

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

concurrency:
  group: pr-ci-test.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bats:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run tests
        run: ./test/bats/bin/bats test/
